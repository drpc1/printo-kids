        height: 100%;

      }

        padding: 16px;
        max-width: 36rem;
        margin: 0 auto;
      }
      main p {
        line-height: 1.5;
      }
      main a {
        margin: 0 2px;
      }
      .sheet {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 210 / 297;
        outline: 1px solid #000;
      }
      .sheet text {
        font-size: 5.5px;
        fill: #000;
        text-anchor: middle;
      }
      .sheet .big {
        font-size: 16px;
        font-weight: 700;
      }
      .sheet .small {
        font-size: 3.6px;
      }
      .sheet .b,
      .sheet .pv {
        display: none;
      }
      .print-only {
        display: none;
      }

      /* Ta sama reguła co w GeneratorShell.astro (#worksheet-home svg). */
      @media print {
        html,
        body {
          height: auto !important;
          overflow: hidden;
          background: none;
        }
        main {
          padding: 0;
          max-width: none;
        }
        .screen-only {
          display: none;
        }
        .sheet {
          width: 210mm;
          height: 297mm;
          overflow: hidden;
          outline: none;
          max-width: 100%;
          max-height: 100vh;
        }
        .sheet .print-only {
          display: inline;
        }
        .sheet .screen-note {
          display: none;
        }
      }

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var vh = params.get("vh");
        if (vh && /^[0-9]+$/.test(vh) && +vh >= 100 && +vh <= 130 && +vh % 2 === 0) {
          document.documentElement.dataset.vh = vh;
        }
        var label = document.documentElement.dataset.vh + "vh";
        document.getElementById("vh-label").textContent = label;
        document.title = "Sonda druku " + label;
        var ua = navigator.userAgent;
        var name = /EdgiOS/.test(ua)
          ? "Edge iOS"
          : /CriOS/.test(ua)
            ? "Chrome iOS"
            : /FxiOS/.test(ua)
              ? "Firefox iOS"
              : /Safari/.test(ua)
                ? "Safari lub Brave"
                : "inna";
        document.getElementById("browser").textContent = "przeglądarka (z UA): " + name;
        var brave = typeof navigator.brave;
        document.getElementById("brave").textContent = "navigator.brave: " + (brave === "undefined" ? "brak" : brave);
        document.getElementById("ua1").textContent = ua.slice(0, 70);
        document.getElementById("ua2").textContent = ua.slice(70, 140);
        document.getElementById("ua3").textContent = ua.slice(140, 210);
        document.getElementById("screen").textContent =
          "ekran: " + innerWidth + " × " + innerHeight + " px, dpr " + devicePixelRatio;
        function onPrint(source) {
          document.getElementById("printjs").textContent =
            "druk (JS, " + source + "): " + innerWidth + " × " + innerHeight + " px";
        }
        addEventListener("beforeprint", function () {
          onPrint("beforeprint");
        });
        var mq = matchMedia("print");
        if (mq.addEventListener)
          mq.addEventListener("change", function (e) {
            if (e.matches) onPrint("media");
          });
      })();
    </script>
