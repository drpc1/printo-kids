name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            range="$base...$head"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            range="$base..$head"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$base:scripts/context-only-diff.mjs" > "$RUNNER_TEMP/context-only-diff.mjs"
          app="$(git diff -z -M --name-status "$range" | node "$RUNNER_TEMP/context-only-diff.mjs")"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build
      - name: Build staging and check the Worker name
        run: |
          CLOUDFLARE_ENV=staging npm run build
          node -e 'process.exit(require("./dist/server/wrangler.json").name === "printo-kids-staging" ? 0 : 1)'

  smoke:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke

  e2e:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=phone-360 --project=pixel-7 --project=tablet-768
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
